<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор заявок</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <h1 class="title">Генератор заявок</h1>

        <form id="formZayavki" class="form" autocomplete="off">
            <div class="form__row">
                <div class="form__group">
                    <label class="form__label" for="nomer">Номер заявки</label>
                    <input type="number" id="nomer" class="form__input" placeholder="28" min="1" required>
                </div>
                <div class="form__group">
                    <label class="form__label" for="vremya_napravleniya">Время направления</label>
                    <input type="time" id="vremya_napravleniya" class="form__input" required>
                </div>
            </div>

            <div class="form__row">
                <div class="form__group">
                    <label class="form__label">Дата и время решения</label>
                    <div class="form__pair">
                        <input type="date" id="data_resheniya_date" class="form__input" required>
                        <input type="time" id="data_resheniya_time" class="form__input" required>
                    </div>
                </div>
                <div class="form__group">
                    <label class="form__label">Дата и время начала передачи</label>
                    <div class="form__pair">
                        <input type="date" id="data_nachala_date" class="form__input" required>
                        <input type="time" id="data_nachala_time" class="form__input" required>
                    </div>
                </div>
            </div>

            <div class="form__group">
                <div class="form__label-row">
                    <label class="form__label" for="tekst">Текст оповещения</label>
                    <span class="form__counter"><span id="tekstCount">0</span>/134</span>
                </div>
                <textarea id="tekst" class="form__input form__textarea" rows="2" maxlength="134"
                    placeholder="Введите текст оповещения..." required></textarea>
            </div>

            <button type="submit" class="form__submit" id="submitBtn">
                <span class="form__submit-text">Скачать ZIP</span>
                <span class="form__submit-loader" id="loader"></span>
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.50.0/build/docxtemplater.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
